<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraud Detection Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5; color: #1a1a2e; padding: 2rem;
  }
  .container { max-width: 900px; margin: 0 auto; }

  h1 { text-align: center; margin-bottom: 0.25rem; }
  .subtitle {
    text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.9rem;
  }

  .card {
    background: white; border-radius: 12px; padding: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .field label {
    display: block; font-size: 0.75rem; font-weight: 600; color: #555;
    margin-bottom: 2px;
  }
  .field input {
    width: 100%; padding: 0.4rem 0.5rem; border: 1px solid #ccc;
    border-radius: 6px; font-size: 0.8rem; transition: border-color 0.2s;
  }
  .field input:focus {
    outline: none; border-color: #4361ee; box-shadow: 0 0 0 2px rgba(67,97,238,0.15);
  }
  .field input.invalid { border-color: #e63946; background: #fff5f5; }

  .amount-time {
    display: flex; gap: 1rem; margin-bottom: 1rem;
  }
  .amount-time .field { flex: 1; }
  .amount-time .field input { padding: 0.6rem 0.5rem; font-size: 0.9rem; }

  .actions {
    display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem;
  }
  .actions button {
    padding: 0.6rem 1.2rem; border: none; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .actions button:hover { transform: translateY(-1px); }

  .btn-predict {
    background: #4361ee; color: white; flex: 1; min-width: 140px;
  }
  .btn-predict:hover { background: #3a56d4; }

  .btn-legit {
    background: #2ec4b6; color: white;
  }
  .btn-legit:hover { background: #25a99d; }
  .btn-fraud {
    background: #e63946; color: white;
  }
  .btn-fraud:hover { background: #c5303c; }
  .btn-clear {
    background: #e0e0e0; color: #333;
  }
  .btn-clear:hover { background: #ccc; }

  #result {
    display: none; margin-top: 1.5rem; padding: 1.5rem;
    border-radius: 12px; text-align: center;
  }
  #result.legitimate { background: #d4edda; color: #155724; display: block; }
  #result.fraud { background: #f8d7da; color: #721c24; display: block; }

  #result .badge {
    display: inline-block; padding: 0.4rem 1.2rem; border-radius: 20px;
    font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem;
  }
  #result.legitimate .badge { background: #28a745; color: white; }
  #result.fraud .badge { background: #dc3545; color: white; }

  #result .prob { font-size: 2rem; font-weight: 800; margin: 0.5rem 0; }
  #result .detail { font-size: 0.85rem; opacity: 0.8; }

  #error {
    display: none; background: #fff3cd; color: #856404; padding: 0.8rem;
    border-radius: 8px; margin-top: 0.5rem; font-size: 0.85rem;
  }

  .section-title {
    font-size: 0.85rem; font-weight: 600; color: #888; margin-bottom: 0.5rem;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.online { background: #28a745; }
  .status-dot.offline { background: #dc3545; }
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ Fraud Detection</h1>
  <p class="subtitle">Enter transaction details below to check if it's fraudulent</p>

  <div class="card">
    <div class="section-title">V-Features (V1-V28)</div>
    <div class="grid" id="v-grid"></div>

    <div class="section-title">Transaction Info</div>
    <div class="amount-time">
      <div class="field">
        <label for="Amount">Amount ($)</label>
        <input type="text" id="Amount" placeholder="e.g. 142.50" />
      </div>
      <div class="field">
        <label for="Time">Time (seconds)</label>
        <input type="text" id="Time" placeholder="e.g. 86400" />
      </div>
    </div>

    <div class="actions">
      <button class="btn-predict" onclick="predict()">🔍 Predict</button>
      <button class="btn-legit" onclick="fillLegit()">✅ Fill Legitimate</button>
      <button class="btn-fraud" onclick="fillFraud('fraud-low')">⚠️ Low (0-10%)</button>
      <button class="btn-fraud" onclick="fillFraud('fraud-medium-low')">⚖️ Med-Low (10-70%)</button>
      <button class="btn-fraud" onclick="fillFraud('fraud-medium-high')">🔥 Med-High (70-90%)</button>
      <button class="btn-fraud" onclick="fillFraud('fraud-high')">🚨 High (90%+)</button>
      <button class="btn-fraud" onclick="fillFraud('fraud-random')">🎲 Random</button>
      <button class="btn-clear" onclick="clearForm()">✕ Clear</button>
    </div>
    <div id="example-hint" style="font-size:0.75rem;color:#888;margin-top:0.5rem;display:none"></div>

    <div id="error"></div>
    <div id="result">
      <div class="badge"></div>
      <div class="prob"></div>
      <div class="detail"></div>
    </div>
  </div>

  <div style="text-align:center;margin-top:1rem">
    <a href="/dashboard" style="color:#4361ee;font-size:0.85rem">📊 View Dashboard</a>
  </div>
</div>

<script>
  // ── Build V inputs ────────────────────────────────────────────────
  for (let i = 1; i <= 28; i++) {
    const div = document.createElement('div');
    div.className = 'field';
    div.innerHTML = `<label for="V${i}">V${i}</label>
      <input type="text" id="V${i}" placeholder="-1.0 to 1.0" />`;
    document.getElementById('v-grid').appendChild(div);
  }

  const V_FIELDS = Array.from({length: 28}, (_, i) => `V${i+1}`);
  const ALL_FIELDS = [...V_FIELDS, 'Amount', 'Time'];

  // ── Validation ────────────────────────────────────────────────────
  function validate() {
    let valid = true;
    ALL_FIELDS.forEach(id => {
      const el = document.getElementById(id);
      const val = parseFloat(el.value);
      if (isNaN(val)) {
        el.classList.add('invalid'); valid = false;
      } else {
        el.classList.remove('invalid');
      }
    });
    return valid;
  }

  function getValues() {
    const data = {};
    ALL_FIELDS.forEach(id => {
      data[id] = parseFloat(document.getElementById(id).value);
    });
    return data;
  }

  function setValues(data) {
    ALL_FIELDS.forEach(id => {
      const el = document.getElementById(id);
      if (el && data[id] !== undefined) {
        el.value = typeof data[id] === 'number' ? data[id].toFixed(6) : data[id];
        el.classList.remove('invalid');
      }
    });
  }

  function clearForm() {
    ALL_FIELDS.forEach(id => {
      document.getElementById(id).value = '';
      document.getElementById(id).classList.remove('invalid');
    });
    document.getElementById('result').style.display = 'none';
    document.getElementById('result').className = '';
    document.getElementById('error').style.display = 'none';
    document.getElementById('example-hint').style.display = 'none';
  }

  // ── Fill examples from backend ────────────────────────────────────
  async function fillLegit() {
    const r = await fetch('/examples?type=legit');
    const data = await r.json();
    if (data && Object.keys(data).length) {
      const hint = document.getElementById('example-hint');
      if (data._prob !== undefined) {
        hint.textContent = `Model predicts this as legitimate (confidence: ${(data._prob * 100).toFixed(4)}%)`;
        hint.style.display = 'block';
      } else {
        hint.style.display = 'none';
      }
      setValues(data);
      document.getElementById('result').style.display = 'none';
      document.getElementById('error').style.display = 'none';
    }
  }

  async function fillFraud(type) {
    const r = await fetch(`/examples?type=${type}`);
    const data = await r.json();
    if (data && Object.keys(data).length) {
      const hint = document.getElementById('example-hint');
      if (data._prob !== undefined) {
        hint.textContent = `Model predicts this as ${data._pred ? 'FRAUD' : 'legitimate'} (confidence: ${(data._prob * 100).toFixed(4)}%)`;
        hint.style.display = 'block';
      } else {
        hint.style.display = 'none';
      }
      setValues(data);
      document.getElementById('result').style.display = 'none';
      document.getElementById('error').style.display = 'none';
    }
  }

  // ── Predict ───────────────────────────────────────────────────────
  async function predict() {
    document.getElementById('error').style.display = 'none';
    document.getElementById('result').style.display = 'none';

    if (!validate()) {
      document.getElementById('error').textContent = 'Please fill all fields with valid numbers.';
      document.getElementById('error').style.display = 'block';
      return;
    }

    const data = getValues();
    document.querySelector('.btn-predict').textContent = '⏳ Predicting...';
    document.querySelector('.btn-predict').disabled = true;

    try {
      const r = await fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
      });
      const result = await r.json();

      if (result.error) {
        document.getElementById('error').textContent = result.error;
        document.getElementById('error').style.display = 'block';
        return;
      }

      const cls = result.fraud ? 'fraud' : 'legitimate';
      const div = document.getElementById('result');
      div.className = cls;

      if (result.fraud) {
        div.querySelector('.badge').textContent = '🚨 FRAUD DETECTED';
      } else {
        div.querySelector('.badge').textContent = '✅ LEGITIMATE';
      }

      div.querySelector('.prob').textContent = `${(result.probability * 100).toFixed(4)}%`;
      div.querySelector('.detail').textContent =
        `Fraud probability: ${(result.probability * 100).toFixed(4)}%  |  Threshold: ${(result.threshold * 100).toFixed(0)}%`;
      div.style.display = 'block';

    } catch (e) {
      document.getElementById('error').textContent = 'Prediction failed: ' + e.message;
      document.getElementById('error').style.display = 'block';
    } finally {
      document.querySelector('.btn-predict').textContent = '🔍 Predict';
      document.querySelector('.btn-predict').disabled = false;
    }
  }

  // ── Allow Enter key to submit ─────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') predict();
  });
</script>
</body>
</html>
