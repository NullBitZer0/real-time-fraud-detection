# Sparkov fraud-detection pipeline config

defaults:
  - model: catboost

data:
  # Training data source: "feast" (Postgres via Feast) or "csv" (raw files)
  # Raw CSVs are only needed to re-seed Feast: python feast/seed.py
  source:             feast
  # Time-based split
  val_quantile:        0.80        # last 20% of fraudTrain -> val
  # Target
  target_column:       is_fraud
  # 3-tier thresholds (from notebooks/experiments.ipynb OOF run)
  tier_thresholds:
    tier1_auto_block:   0.5613
    tier2_review_queue: 0.1198
    tier3_soft_signal:  0.0040

model:
  model_name:          catboost
  # Tuned CatBoost params (from Optuna on Sparkov val)
  iterations:          307
  depth:               10
  learning_rate:       0.14757878491291962
  l2_leaf_reg:         19.613363614465985
  random_strength:     1.2157708813939343
  bagging_temperature: 1.1713021441934048
  border_count:        192
  eval_metric:         PRAUC
  early_stopping:      50
  random_seed:         42

optuna:
  enabled:           false        # deferred — run python -m src.components.optuna_tuning separately
  n_trials:          20
  timeout_minutes:   0            # 0 = no timeout (rely on n_trials)

mlflow:
  # DAGsHub-backed tracking — the tracker derives owner/repo from this URL
  # at runtime; env vars DAGSHUB_REPO_OWNER + DAGSHUB_REPO_NAME + DAGSHUB_TOKEN
  # are required for the DAGsHub backend to work. Falls back to local mlruns/
  # if DAGsHub is unreachable.
  tracking_uri:      https://dagshub.com/NullBitZer0/real-time-fraud-detection.mlflow
  experiment_name:   sparkov-fraud
  run_name:          catboost-train
  register_model:    true
  registered_name:   FraudDetectionCatBoost

inference:
  decision_cache_ttl_seconds: 3600

artifacts:
  model_dir:        models
  model_path:       models/catboost.cbm
  metadata_path:    models/metadata.json
  feature_eng_path: models/feature_engineering.pkl
