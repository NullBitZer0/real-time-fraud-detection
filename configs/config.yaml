defaults:
  - model: lightgbm    # switch via CLI: model=xgboost or model=catboost

data:
  raw_path:            data/raw/creditcard.csv
  train_path:          artifacts/train.csv
  test_path:           artifacts/test.csv
  train_processed:     artifacts/train_processed.csv
  test_processed:      artifacts/test_processed.csv
  target_column:       Class
  test_size:           0.2
  scaler:              robust          # standard | robust (robust chosen per experiment)
  inference_threshold: 0.70           # optimised F1 threshold from experiments

optuna:
  enabled:   false     # set to true to run hyperparameter search before training
  n_trials:  20

model_path: models/model.pkl