# Sparkov fraud-detection pipeline params
# Switched from IBM creditcard.csv to Sparkov (fraudTrain/fraudTest.csv) and
# from LightGBM to CatBoost baseline. See notebooks/features.ipynb for the
# research notebook and src/components/ for the production code.

model:
  model_name:      catboost       # was: lightgbm

  # ── CatBoost baseline (test PR-AUC ~0.88 on Sparkov) ──────────────────────
  iterations:      500
  depth:           8
  learning_rate:   0.05
  eval_metric:     PRAUC
  early_stopping:  50
  random_seed:     42
  task_type:       CPU

data:
  train_path:    data/raw/fraudTrain.csv
  test_path:     data/raw/fraudTest.csv
  val_quantile:  0.80        # last 20% of fraudTrain as val
  target_column: is_fraud
  inference_threshold: 0.1198  # F2-optimal (Tier 2 review queue)
