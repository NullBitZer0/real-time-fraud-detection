# DVC is used in this project ONLY for data versioning (DAGsHub S3 remote).
# Pipeline orchestration is handled by Apache Airflow (see airflow/dags/).
#
# DVC commands that still work:
#   dvc add data/raw/<file>.csv     # register a file for tracking
#   dvc push                        # upload the .dvc-tracked files to remote
#   dvc pull                        # download the latest versioned data
#
# Orchestration (replaces `dvc repro`):
#   Weekly retraining:   fraud_retraining DAG (Mon 00:00 UTC)
#   Drift-triggered:     fraud_drift_check DAG (daily 06:00 UTC) → triggers
#                        fraud_retraining when Evidently reports drift on
#                        >= 5 features.
#   Manual trigger:      POST /api/v1/dags/fraud_retraining/dagRuns
#                        on the Airflow REST API.
#
# See airflow/README.md for the full architecture diagram.
