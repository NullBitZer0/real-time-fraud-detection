global:
  scrape_interval: 15s

scrape_configs:
  - job_name: fraud-api
    metrics_path: /metrics/prom
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: fraud-detection-api
          env: local

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: system
          env: local

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: containers
          env: local
