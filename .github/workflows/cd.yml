---
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nullbitzer0/real-time-fraud-detection/fraud-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 20
    env:
      DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER || '' }}
      DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME || '' }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN || '' }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download model artifacts from MLflow
        if: env.DAGSHUB_TOKEN != ''
        run: |
          pip install mlflow dagshub
          python -c "
          import os, sys, time, mlflow
          from mlflow.tracking import MlflowClient

          owner = os.environ['DAGSHUB_REPO_OWNER']
          repo = os.environ['DAGSHUB_REPO_NAME']
          token = os.environ['DAGSHUB_TOKEN']

          tracking_uri = f'https://dagshub.com/{owner}/{repo}.mlflow'
          mlflow.set_tracking_uri(tracking_uri)
          os.environ['MLFLOW_TRACKING_USERNAME'] = token
          os.environ['MLFLOW_TRACKING_PASSWORD'] = token

          NAME = 'FraudDetectionCatBoost'
          client = MlflowClient()
          versions = client.search_model_versions(f\"name='{NAME}'\")
          prod = [v for v in versions if v.current_stage == 'Production']
          staging = [v for v in versions if v.current_stage == 'Staging']

          target = None
          if prod:
            target = max(prod, key=lambda v: int(v.version))
            print(f'Using Production v{target.version}')
          elif staging:
            target = max(staging, key=lambda v: int(v.version))
            print(f'Using Staging v{target.version}')
          else:
            print('No Production or Staging model found')
            sys.exit(1)

          run_id = target.run_id
          os.makedirs('models', exist_ok=True)

          for attempt in range(1, 6):
            try:
              mlflow.artifacts.download_artifacts(run_id=run_id, dst_path='models/')
              print(f'Downloaded: {os.listdir(\"models/\")}')
              break
            except Exception as e:
              if attempt == 5:
                print(f'Download failed after 5 attempts: {e}')
                sys.exit(1)
              print(f'Attempt {attempt} failed, retrying in {10 * attempt}s...')
              time.sleep(10 * attempt)
          "

      - name: Smoke test model artifacts
        if: env.DAGSHUB_TOKEN != ''
        run: |
          pip install catboost joblib pandas scikit-learn
          python -c "
          import os, json
          from catboost import CatBoostClassifier
          import joblib
          import pandas as pd

          model_dir = 'models'

          # Verify all files exist
          required = ['catboost.cbm', 'metadata.json', 'feature_engineering.pkl']
          for f in required:
            path = os.path.join(model_dir, f)
            assert os.path.exists(path), f'Missing: {path}'
            print(f'  OK: {path} ({os.path.getsize(path)} bytes)')

          # Load model
          model = CatBoostClassifier()
          model.load_model(f'{model_dir}/catboost.cbm')

          # Load metadata
          with open(f'{model_dir}/metadata.json') as fp:
            meta = json.load(fp)
          features = meta['feature_list']
          print(f'  Features: {len(features)}')
          assert len(features) > 0, 'No features in metadata'

          # Load feature engineering
          fe = joblib.load(f'{model_dir}/feature_engineering.pkl')
          print(f'  FeatureEngineering loaded: {type(fe).__name__}')

          # Run dummy prediction
          dummy = pd.DataFrame([{f: 0.0 for f in features}])
          proba = model.predict_proba(dummy)
          assert proba.shape == (1, 2), f'Unexpected shape: {proba.shape}'
          print(f'  Dummy prediction: fraud={proba[0][1]:.4f}')
          print('Model smoke test PASSED')
          "

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote main → production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout production 2>/dev/null || git checkout -b production
          git merge main --no-edit -m "chore: promote main to production [skip ci]"
          git push origin production

      - name: Wait for Coolify redeploy
        run: sleep 30

      - name: Health check
        if: env.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sSf "${PRODUCTION_URL}/health" 2>/dev/null || echo "")
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "API healthy"
              exit 0
            fi
            echo "Waiting... attempt $i/10"
            sleep 5
          done
          echo "Health check failed"
          exit 1
