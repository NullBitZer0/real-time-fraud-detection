name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Retrain the production model on every push to main and log to DAGsHub MLflow.
# Steps:
#   1. Install deps
#   2. Build Feast parquet sources (no Postgres needed)
#   3. Train (emits metrics/train_metrics.json)
#   4. METRIC GATE: fail if test_pr_auc < 0.78 (refuse to promote a regressed model)
#   5. Promote Staging → Production (gated by metric + comparison vs current Production)
#   6. Upload model + metrics + drift report as a GitHub Actions artifact
# Docker images are intentionally NOT built/pushed (per repo policy).
jobs:
  train-and-log:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3] pandera prometheus-client evidently

      - name: Download Sparkov dataset (DVC → DAGsHub S3)
        env:
          DAGSHUB_TOKEN:           ${{ secrets.DAGSHUB_TOKEN }}
          # Standard boto3 env vars — DVC's S3 backend picks these up automatically
          AWS_ACCESS_KEY_ID:       ${{ secrets.DAGSHUB_TOKEN }}
          AWS_SECRET_ACCESS_KEY:   ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ENDPOINT_URL_S3:     https://dagshub.com/${{ secrets.DAGSHUB_REPO_OWNER }}/${{ secrets.DAGSHUB_REPO_NAME }}.s3
        run: |
          mkdir -p data/raw
          echo "▶ DAGSHUB_TOKEN length: ${#DAGSHUB_TOKEN}"
          echo "▶ AWS_ACCESS_KEY_ID first 8: ${AWS_ACCESS_KEY_ID:0:8}..."
          echo "▶ AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3}"
          # Verify S3 reachability with a quick HEAD
          python -c "
import os, boto3
c = boto3.client('s3', endpoint_url=os.environ['AWS_ENDPOINT_URL_S3'])
try:
    c.head_object(Bucket='dvc', Key='files/md5/4c/59edef30962764922a9893fb5f5cd4')
    print('  ✓ S3 HEAD OK')
except Exception as e:
    print(f'  ✗ S3 HEAD failed: {e}')
    raise SystemExit(1)
          "
          dvc pull data/raw/fraudTest.csv data/raw/fraudTrain.csv --force
          ls -lh data/raw/

      - name: Build Feast parquet sources
        run: python -m src.components.data_ingestion_feast

      - name: Train + log to DAGsHub MLflow
        env:
          DAGSHUB_REPO_OWNER:   ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME:    ${{ secrets.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN:        ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI:  ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          echo "Tracking URI: ${MLFLOW_TRACKING_URI:-https://dagshub.com/${DAGSHUB_REPO_OWNER}/${DAGSHUB_REPO_NAME}.mlflow}"
          python -m pipelines.training_pipeline

      - name: Generate drift report
        env:
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME:  ${{ secrets.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN:      ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m src.components.drift_report

      - name: Metric gate (refuse to promote if PR-AUC < 0.78)
        env:
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME:  ${{ secrets.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN:      ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys
          with open("metrics/train_metrics.json") as f:
              m = json.load(f)
          pr = float(m.get("test_pr_auc", 0.0))
          floor = 0.78
          print(f"test_pr_auc = {pr:.4f}  (floor = {floor})")
          if pr < floor:
              print(f"::error::REJECTED: test_pr_auc {pr:.4f} < floor {floor}")
              sys.exit(1)
          print("✓ Metric gate passed")
          PY

      - name: Promote Staging → Production
        if: success()
        env:
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME:  ${{ secrets.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN:      ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m src.components.mlflow_promote --floor 0.78

      - name: Upload trained artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: catboost-model
          path: |
            models/catboost.cbm
            models/feature_engineering.pkl
            models/metadata.json
            models/production_alias.json
            metrics/train_metrics.json
            metrics/drift_report.html
            metrics/drift_report.json
          retention-days: 30
