name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fraud-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER || '' }}
      DAGSHUB_REPO_NAME:  ${{ secrets.DAGSHUB_REPO_NAME || '' }}
      DAGSHUB_TOKEN:      ${{ secrets.DAGSHUB_TOKEN || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3]

      - name: Compile-check (all paths)
        run: python -m compileall -q src/ pipelines/ api/ tests/ scripts/ feast/ airflow/dags/

      # ── 1. Download Model Artifacts ────────────────────────────────────────────
      - name: Download model artifacts from MLflow
        if: env.DAGSHUB_TOKEN != ''
        run: |
          python -c "
          import os, sys, mlflow
          from mlflow.tracking import MlflowClient

          owner = os.environ['DAGSHUB_REPO_OWNER']
          repo  = os.environ['DAGSHUB_REPO_NAME']
          token = os.environ['DAGSHUB_TOKEN']

          tracking_uri = f'https://dagshub.com/{owner}/{repo}.mlflow'
          mlflow.set_tracking_uri(tracking_uri)
          os.environ['MLFLOW_TRACKING_USERNAME'] = token
          os.environ['MLFLOW_TRACKING_PASSWORD'] = token

          NAME = 'FraudDetectionCatBoost'
          client = MlflowClient()
          versions = client.search_model_versions(f\"name='{NAME}'\")
          prod = [v for v in versions if v.current_stage == 'Production']
          staging = [v for v in versions if v.current_stage == 'Staging']

          target = None
          if prod:
            target = max(prod, key=lambda v: int(v.version))
            print(f'Using Production v{target.version}')
          elif staging:
            target = max(staging, key=lambda v: int(v.version))
            print(f'Using Staging v{target.version}')
          else:
            print('No Production or Staging model found')
            sys.exit(1)

          run_id = target.run_id
          os.makedirs('models', exist_ok=True)
          mlflow.artifacts.download_artifacts(run_id=run_id, dst_path='models/')
          print(f'Downloaded: {os.listdir(\"models/\")}')
          "

      # ── 2. Build + Push to GHCR ───────────────────────────────────────────────
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo "✓ Image pushed:"
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            [ -n "$tag" ] && echo "  $tag"
          done

      # ── 3. Deploy Staging ─────────────────────────────────────────────────────
      - name: Start staging stack
        run: |
          touch .env
          docker compose up -d postgres redis
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U feast 2>/dev/null && break
            sleep 2
          done
          docker compose up -d api
          echo "✓ Staging stack started"

      - name: Wait for API health
        run: |
          for i in $(seq 1 15); do
            sleep 3
            STATUS=$(curl -sSf http://localhost:8000/readyz 2>/dev/null || echo "")
            echo "$STATUS" | grep -q '"ready":true' && break
            echo "  waiting... attempt $i/15"
          done
          curl -sSf http://localhost:8000/readyz | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('ready'), f'not ready: {d}'; print('✓ API ready')"

      # ── 4. Health + Smoke Tests ──────────────────────────────────────────────
      - name: Health check
        run: |
          curl -sSf http://localhost:8000/health | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('status') == 'ok', f'health failed: {d}'
          assert d.get('model_loaded'), 'model not loaded'
          print(f\"✓ Health OK  (model: {d.get('model_name')})\")
          "

      - name: API smoke test
        run: |
          python -c "
          import json, urllib.request, sys

          BASE = 'http://localhost:8000'

          def req(method, path, data=None):
            url = BASE + path
            body = json.dumps(data).encode() if data else None
            r = urllib.request.urlopen(urllib.request.Request(url, data=body,
              method=method,
              headers={'Content-Type': 'application/json'} if body else {},
            ), timeout=30)
            return json.loads(r.read())

          payload = {
            'trans_date_trans_time': '2020-06-21 12:00:00',
            'cc_num': 1234567890123456.0,
            'merchant': 'fraud_McDonalds',
            'category': 'grocery_pos',
            'amt': 142.50,
            'lat': 40.7128,
            'long': -74.0060,
            'merch_lat': 40.7580,
            'merch_long': -73.9855,
            'city': 'New York',
            'state': 'NY',
            'job': 'Engineer',
            'dob': '1985-03-15',
            'zip': 10001,
          }
          body = req('POST', '/predict', payload)
          assert 0 <= body['fraud_probability'] <= 1, f'bad proba: {body}'
          assert body['tier'] in (0, 1, 2, 3), f'bad tier: {body}'
          print(f'  POST /predict  -> 200  proba={body[\"fraud_probability\"]:.4f}  tier={body[\"tier\"]}  latency={body[\"latency_ms\"]}ms')

          body = req('GET', '/health')
          assert body.get('status') == 'ok', f'/health: {body}'
          print(f'  GET  /health   -> 200  model_loaded={body[\"model_loaded\"]}')

          body = req('GET', '/readyz')
          assert body.get('ready'), f'/readyz: {body}'
          print(f'  GET  /readyz   -> 200  ready=True')

          body = req('GET', '/metrics')
          print(f'  GET  /metrics  -> 200  total_txns={body[\"total_transactions\"]}')

          print()
          print('All smoke tests passed')
          "

      # ── 5. Model Performance Gate ────────────────────────────────────────────
      - name: Model performance gate
        if: env.DAGSHUB_TOKEN != ''
        run: |
          python -m src.components.mlflow_promote --floor 0.78

      # ── 6. Cleanup ────────────────────────────────────────────────────────────
      - name: Stop staging stack
        if: always()
        run: |
          docker compose down -v 2>/dev/null || true
          echo "✓ Staging stack cleaned up"
