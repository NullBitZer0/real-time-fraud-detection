name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Continuous Deployment:
#   - Pulls the latest DVC-tracked data from DAGsHub S3
#   - Runs lint + tests to ensure main is green
#   - (Optional) triggers a manual Airflow DAG run on a production Airflow host
#
# Model RETRAINING and PROMOTION are no longer done in CI/CD — those are
# handled by Airflow (see airflow/dags/fraud_retraining.py) on a weekly
# schedule + drift-triggered basis. This keeps the deploy path short and
# predictable.
#
# Docker images are intentionally NOT built/pushed (per repo policy).
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3] pandera prometheus-client evidently

      - name: Download Sparkov dataset (DVC → DAGsHub S3)
        env:
          DAGSHUB_TOKEN:           ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ACCESS_KEY_ID:       ${{ secrets.DAGSHUB_TOKEN }}
          AWS_SECRET_ACCESS_KEY:   ${{ secrets.DAGSHUB_TOKEN }}
          AWS_ENDPOINT_URL_S3:     https://dagshub.com/${{ secrets.DAGSHUB_REPO_OWNER }}/${{ secrets.DAGSHUB_REPO_NAME }}.s3
        run: |
          mkdir -p data/raw
          python scripts/s3_smoke_test.py
          dvc pull data/raw/fraudTest.csv data/raw/fraudTrain.csv --force
          ls -lh data/raw/

      - name: Lint (Ruff)
        run: ruff check src/ api/ pipelines/ tests/ scripts/

      - name: Compile Python (syntax check)
        run: |
          python -m compileall -q src/ api/ pipelines/ tests/ scripts/

      - name: Run unit tests
        env:
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME:  ${{ secrets.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN:      ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python -m tests.test_api

  trigger-airflow:
    # Optionally trigger an Airflow DAG run on a deployed Airflow host
    # (e.g. the demo VM). Gated by an `AIRFLOW_*` secrets — skip if absent.
    # NOTE: the `env` context is not available in job-level `if` expressions
    # in GitHub Actions, so the AIRFLOW_URL presence check has to live on
    # the step, not on the job.
    needs: lint-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRFLOW_URL:        ${{ secrets.AIRFLOW_URL        || '' }}
      AIRFLOW_USER:       ${{ secrets.AIRFLOW_USER       || 'admin' }}
      AIRFLOW_PASSWORD:   ${{ secrets.AIRFLOW_PASSWORD   || '' }}
    steps:
      - name: Trigger fraud_retraining DAG
        if: env.AIRFLOW_URL != ''
        run: |
          if [[ -z "$AIRFLOW_URL" ]]; then
            echo "AIRFLOW_URL not configured — skipping Airflow trigger"
            exit 0
          fi
          curl -sf -X POST "${AIRFLOW_URL}/api/v1/dags/fraud_retraining/dagRuns" \
            -H "Content-Type: application/json" \
            -u "${AIRFLOW_USER}:${AIRFLOW_PASSWORD}" \
            -d '{"conf": {"trigger_source": "github-cd"}}' \
            | tee /tmp/airflow_response.json
          echo "✓ Triggered Airflow DAG run"
