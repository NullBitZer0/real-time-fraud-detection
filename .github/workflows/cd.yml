name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT || '' }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST || '' }}
      AIRFLOW_URL: ${{ secrets.AIRFLOW_URL || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[s3]

      - name: Compile-check (all paths)
        run: python -m compileall -q src/ pipelines/ api/ tests/ scripts/ feast/ airflow/dags/

      # ── 1. Build ──────────────────────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build -t fraud-api:${{ github.sha }} .
          docker tag fraud-api:${{ github.sha }} fraud-api:staging
          echo "✓ Image built: fraud-api:${{ github.sha }}"

      # ── 2. Deploy Staging ─────────────────────────────────────────────────────
      - name: Start staging stack
        run: |
          touch .env
          docker compose up -d postgres redis
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U feast 2>/dev/null && break
            sleep 2
          done
          docker compose up -d api
          echo "✓ Staging stack started"

      - name: Wait for API health
        run: |
          for i in $(seq 1 15); do
            sleep 3
            STATUS=$(curl -sSf http://localhost:8000/readyz 2>/dev/null || echo "")
            echo "$STATUS" | grep -q '"ready":true' && break
            echo "  waiting... attempt $i/15"
          done
          curl -sSf http://localhost:8000/readyz | python -c "import sys,json; d=json.load(sys.stdin); assert d.get('ready'), f'not ready: {d}'; print('✓ API ready')"

      # ── 3. Health + Smoke Tests ──────────────────────────────────────────────
      - name: Health check
        run: |
          curl -sSf http://localhost:8000/health | python -c "
            import sys, json
            d = json.load(sys.stdin)
            assert d.get('status') == 'ok', f'health failed: {d}'
            assert d.get('model_loaded'), 'model not loaded'
            print(f\"✓ Health OK  (model: {d.get('model_name')})\")
          "

      - name: API smoke test
        run: |
          python -c "
            import json, urllib.request, sys

            BASE = 'http://localhost:8000'

            def req(method, path, data=None):
                url = BASE + path
                body = json.dumps(data).encode() if data else None
                r = urllib.request.urlopen(urllib.request.Request(url, data=body,
                    method=method,
                    headers={'Content-Type': 'application/json'} if body else {},
                ), timeout=30)
                return json.loads(r.read())

            # predict — single transaction
            payload = {
                'trans_date_trans_time': '2020-06-21 12:00:00',
                'cc_num': 1234567890123456.0,
                'merchant': 'fraud_McDonalds',
                'category': 'grocery_pos',
                'amt': 142.50,
                'lat': 40.7128,
                'long': -74.0060,
                'merch_lat': 40.7580,
                'merch_long': -73.9855,
                'city': 'New York',
                'state': 'NY',
                'job': 'Engineer',
                'dob': '1985-03-15',
                'zip': 10001,
            }
            body = req('POST', '/predict', payload)
            assert 0 <= body['fraud_probability'] <= 1, f'bad proba: {body}'
            assert body['tier'] in (0, 1, 2, 3), f'bad tier: {body}'
            print(f'  POST /predict  → 200  proba={body[\"fraud_probability\"]:.4f}  tier={body[\"tier\"]}  latency={body[\"latency_ms\"]}ms')

            # health
            body = req('GET', '/health')
            assert body.get('status') == 'ok', f'/health: {body}'
            print(f'  GET  /health   → 200  model_loaded={body[\"model_loaded\"]}')

            # readyz
            body = req('GET', '/readyz')
            assert body.get('ready'), f'/readyz: {body}'
            print(f'  GET  /readyz   → 200  ready=True')

            # metrics
            body = req('GET', '/metrics')
            print(f'  GET  /metrics  → 200  total_txns={body[\"total_transactions\"]}')

            print()
            print('✓ All smoke tests passed')
          "

      # ── 4. Model Performance Gate ────────────────────────────────────────────
      - name: Model performance gate
        env:
          DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
          DAGSHUB_REPO_NAME:  ${{ secrets.DAGSHUB_REPO_NAME }}
          DAGSHUB_TOKEN:      ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m src.components.mlflow_promote --floor 0.78

      # ── 5. Production Rollout ───────────────────────────────────────────────
      - name: Push image to registry (GHCR)
        if: env.GHCR_PAT != ''
        run: |
          echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag fraud-api:${{ github.sha }} ghcr.io/${{ github.repository }}/fraud-api:production
          docker push ghcr.io/${{ github.repository }}/fraud-api:production
          echo "✓ Production image pushed to ghcr.io"

      - name: Deploy production
        if: env.PRODUCTION_HOST != ''
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || '' }}
        run: |
          echo "$SSH_KEY" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
          ssh -i /tmp/ssh_key -o StrictHostKeyChecking=no deploy@$PRODUCTION_HOST "
            docker pull ghcr.io/${{ github.repository }}/fraud-api:production
            docker compose -f /opt/fraud/docker-compose.yml up -d api
            echo '✓ Production deployed'
          "

      - name: Trigger Airflow retrain
        if: env.AIRFLOW_URL != ''
        run: |
          curl -sf -X POST "${AIRFLOW_URL}/api/v1/dags/fraud_retraining/dagRuns" \
            -H "Content-Type: application/json" \
            -u "admin:${{ secrets.AIRFLOW_PASSWORD }}" \
            -d '{"conf": {"trigger_source": "github-cd"}}' \
            && echo "✓ Airflow fraud_retraining triggered"

      # ── Rollback if any gate failed — task-level failures already stop the job.
      # A rollback workflow is available separately at .github/workflows/rollback.yml
