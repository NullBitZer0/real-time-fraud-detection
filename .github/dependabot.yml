version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    open-pull-requests-limit: 5
    groups:
      major:
        patterns: ["*"]
        update-types: ["major"]
      minor:
        patterns: ["*"]
        update-types: ["minor"]
      patch:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend"]
    open-pull-requests-limit: 5
    groups:
      frontend-major:
        patterns: ["*"]
        update-types: ["major"]
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor"]
      frontend-patch:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 3
