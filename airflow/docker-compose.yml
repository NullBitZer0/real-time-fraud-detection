# Airflow stack for the fraud-detection project.
#
# Brings up:
#   • airflow-postgres  — Airflow metadata DB (separate from the main project PG)
#   • airflow-init      — one-shot: runs `airflow db init` + creates admin user
#   • airflow-webserver — UI at http://localhost:8080  (admin / admin)
#   • airflow-scheduler — picks up DAGs in airflow/dags/
#
# Run:
#   docker compose -f airflow/docker-compose.yml up -d
#
# Stop:
#   docker compose -f airflow/docker-compose.yml down
#
# Notes:
#   • We use LocalExecutor (works for demo). For HA swap to CeleryExecutor.
#   • DAGs and logs are bind-mounted so edits on the host show up live.
#   • The .env file at the project root is read by Python tasks (via
#     python-dotenv) so DAGSHUB_TOKEN, MLFLOW_TRACKING_URI, etc. are available.
---
name: fraud-airflow

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    PYTHONPATH: "/opt/airflow/project"
    PROJECT_ROOT: "/opt/airflow/project"
    # Project-level env (DAGsHub, MLflow, DVC remote) — read by the project's
    # .env file inside tasks via python-dotenv. We still pass the most critical
    # ones explicitly so Airflow itself (scheduler, webserver) can reach the
    # MLflow tracker. Defaults are blank so missing-vars don't print warnings
    # (the DAGs themselves will report an error if a var is actually required).
    DAGSHUB_REPO_OWNER: ${DAGSHUB_REPO_OWNER:-}
    DAGSHUB_REPO_NAME:  ${DAGSHUB_REPO_NAME:-}
    DAGSHUB_TOKEN:      ${DAGSHUB_TOKEN:-}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-https://dagshub.com/${DAGSHUB_REPO_OWNER:-}/${DAGSHUB_REPO_NAME:-}.mlflow}
    AWS_ACCESS_KEY_ID:    ${DAGSHUB_TOKEN:-}
    AWS_SECRET_ACCESS_KEY: ${DAGSHUB_TOKEN:-}
    AWS_ENDPOINT_URL_S3:  https://dagshub.com/api/v1/repos/${DAGSHUB_REPO_OWNER:-}/${DAGSHUB_REPO_NAME:-}/storage/raw/s3
  volumes:
    - ../:/opt/airflow/project
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  depends_on:
    airflow-postgres:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

services:
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - airflow_postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname  User \
          --role  Admin \
          --email admin@example.com \
          --password admin || true
        echo "✓ Airflow initialised"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    expose:
      - "8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_postgres:
  airflow_logs:
  airflow_plugins:
