services:
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  airflow-init:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONPATH: "/opt/airflow/project"
      PROJECT_ROOT: "/opt/airflow/project"
      DAGSHUB_REPO_OWNER: ${DAGSHUB_REPO_OWNER:-}
      DAGSHUB_REPO_NAME: ${DAGSHUB_REPO_NAME:-}
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      AWS_ACCESS_KEY_ID: ${DAGSHUB_TOKEN:-}
      AWS_SECRET_ACCESS_KEY: ${DAGSHUB_TOKEN:-}
      AWS_ENDPOINT_URL_S3: https://dagshub.com/api/v1/repos/${DAGSHUB_REPO_OWNER:-}/${DAGSHUB_REPO_NAME:-}/storage/raw/s3
    volumes:
      - ../:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    depends_on:
      airflow-postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db init
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
        echo "Airflow initialised"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

  airflow-webserver:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONPATH: "/opt/airflow/project"
      PROJECT_ROOT: "/opt/airflow/project"
      DAGSHUB_REPO_OWNER: ${DAGSHUB_REPO_OWNER:-}
      DAGSHUB_REPO_NAME: ${DAGSHUB_REPO_NAME:-}
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      AWS_ACCESS_KEY_ID: ${DAGSHUB_TOKEN:-}
      AWS_SECRET_ACCESS_KEY: ${DAGSHUB_TOKEN:-}
      AWS_ENDPOINT_URL_S3: https://dagshub.com/api/v1/repos/${DAGSHUB_REPO_OWNER:-}/${DAGSHUB_REPO_NAME:-}/storage/raw/s3
    volumes:
      - ../:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M

  airflow-scheduler:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      PYTHONPATH: "/opt/airflow/project"
      PROJECT_ROOT: "/opt/airflow/project"
      DAGSHUB_REPO_OWNER: ${DAGSHUB_REPO_OWNER:-}
      DAGSHUB_REPO_NAME: ${DAGSHUB_REPO_NAME:-}
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      AWS_ACCESS_KEY_ID: ${DAGSHUB_TOKEN:-}
      AWS_SECRET_ACCESS_KEY: ${DAGSHUB_TOKEN:-}
      AWS_ENDPOINT_URL_S3: https://dagshub.com/api/v1/repos/${DAGSHUB_REPO_OWNER:-}/${DAGSHUB_REPO_NAME:-}/storage/raw/s3
    volumes:
      - ../:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  airflow_postgres:
  airflow_logs:
  airflow_plugins:
